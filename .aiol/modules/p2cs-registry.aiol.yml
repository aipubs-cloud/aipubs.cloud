# AIOL Module Specification: Registry
# risk: low
schema_version: "1.0.0"
module_id: p2cs.registry
name: ComponentRegistry
version: "0.1.0-alpha"
description: >
  Canonical index of all P2CS-generated artifacts including libraries, AIOL modules,
  experiments, datasets, benchmarks, and documentation. Tracks semantic versions,
  dependency relationships, and provenance references.

lifecycle:
  initial_state: idle
  states: [idle, indexing, indexed, failed]
  terminal_states: [failed]
  transitions:
    - { from: idle,     to: indexing, trigger: register_requested }
    - { from: indexing, to: indexed,  trigger: register_succeeded }
    - { from: indexing, to: failed,   trigger: register_error }

inputs:
  - name: artifact_manifest
    type: "ComponentManifest | ExperimentManifest | BenchmarkReport"
    required: true
  - name: provenance_manifest
    type: ProvenanceManifest
    required: true

outputs:
  - name: registry_entry
    type: RegistryEntry

events:
  - name: registry.updated
    payload_type: RegistryEntry

interfaces:
  - name: IRegistry
    contract: p2cs.registry.IRegistry
  - name: IRegistryStore
    contract: p2cs.registry.IRegistryStore

capabilities:
  - registry.read
  - registry.write

plugin_interfaces: []

dependencies:
  - module_id: p2cs.provenance
    version: ">=0.1.0"
