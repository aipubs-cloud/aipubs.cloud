name: Generate Search Index

on:
  push:
    branches: [main]
    paths:
      - "research/papers/**"
      - "scripts/generate_papers_index.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-index:
    name: Generate papers.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Generate search index
        run: python scripts/generate_papers_index.py --out research/papers/index.json

      - name: Open PR if index changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: regenerate papers search index [skip ci]"
          branch: ci/regenerate-papers-index
          title: "ci: regenerate papers search index"
          body: "Automated update of `research/papers/index.json` triggered by changes to papers or the index script."
          labels: automated
          add-paths: research/papers/index.json
