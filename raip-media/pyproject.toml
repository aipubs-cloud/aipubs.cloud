[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raip-media"
version = "0.1.0"
description = "RAIP Media Intelligence Suite MVP — console dashboard for media provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
raip-media = "raip_media.cli:main"

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
ffmpeg = ["ffmpeg-python>=0.2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["raip_media*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
